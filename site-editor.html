<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOLLGAMES Site Setup</title><link rel="stylesheet" href="./css/style.css"><style>body{background:#f6f9ff}.wrap{padding:50px 0}.panel{background:white;border:1px solid #e6edf7;border-radius:22px;padding:26px;margin-bottom:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}label{font-size:13px;font-weight:800;display:block;margin:12px 0 5px}input,textarea{width:100%;padding:12px 14px;border:1px solid #dfe7f3;border-radius:10px;font:inherit}textarea{min-height:110px}@media(max-width:760px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="container"><span class="kicker">NOLLGAMES</span><h1 style="font-size:44px">SNS / 웹 설정 도우미</h1><div class="panel"><h3>SNS 링크</h3><div class="grid"><div><label>YouTube URL</label><input id="yt" placeholder="https://youtube.com/@..."></div><div><label>Instagram URL</label><input id="ig" placeholder="https://instagram.com/..."></div><div><label>대표 YouTube 영상 ID</label><input id="vid" placeholder="예: dQw4w9WgXcQ"></div><div><label>문의 이메일</label><input id="email" placeholder="contact@company.com"></div></div><div class="actions"><button class="btn primary" onclick="downloadConfig()">site-config.js 다운로드</button></div></div><div class="panel"><h3>사용 방법</h3><p>다운로드된 <b>site-config.js</b>를 저장소의 <b>js/site-config.js</b>와 교체하면 홈페이지의 YouTube, Instagram, 대표 영상, 이메일이 자동으로 갱신됩니다.</p><p>새 게임은 <b>js/games.js</b>의 객체를 복사해 추가하면 됩니다.</p></div></div></main><script>function downloadConfig(){const s=`window.NOLLGAMES_CONFIG = ${JSON.stringify({companyName:"NOLLGAMES",email:document.getElementById("email").value,youtubeUrl:document.getElementById("yt").value,instagramUrl:document.getElementById("ig").value,featuredYoutubeVideoId:document.getElementById("vid").value,latestVideoTitle:"NOLLGAMES Gameplay"},null,2)};`;const b=new Blob([s],{type:"text/javascript"}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download="site-config.js";a.click();URL.revokeObjectURL(u)}</script></body></html>
